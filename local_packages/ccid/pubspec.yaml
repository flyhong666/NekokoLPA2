name: ccid
description: "A Flutter plugin for smart card reader using CCID protocol with PC/SC-like APIs."
version: 0.1.1
homepage: https://github.com/nfcim/ccid

environment:
  sdk: '>=3.3.3 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  convert: ^3.1.1
  async: ^2.8.2
  ffi: ^2.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  ffigen: ^9.0.1
  lints: ^3.0.0
  test: ^1.16.0

flutter:
  plugin:
    platforms:
      android:
        package: im.nfc.ccid
        pluginClass: CcidPlugin
      ios:
        pluginClass: CcidPlugin
      linux:
        pluginClass: CcidPlugin
      macos:
        pluginClass: CcidPlugin
      windows:
        pluginClass: CcidPluginCApi
