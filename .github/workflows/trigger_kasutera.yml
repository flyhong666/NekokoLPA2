name: Trigger Kasutera rebuild

# Fires after any push to the public default / release branches so the
# downstream private Kasutera repo can rebuild against the latest public
# source. Requires repo secret `KASUTERA_DISPATCH_TOKEN` — a fine-grained PAT
# scoped to the iebb/Kasutera repo with `contents: read` and `actions: write`
# (or classic PAT with `repo` scope).

on:
  push:
    branches:
      - main
      - master
      - release
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to iebb/Kasutera
        env:
          KASUTERA_TOKEN: ${{ secrets.KASUTERA_DISPATCH_TOKEN }}
        run: |
          if [ -z "${KASUTERA_TOKEN}" ]; then
            echo "::warning::KASUTERA_DISPATCH_TOKEN not configured; skipping dispatch."
            exit 0
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${KASUTERA_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/iebb/Kasutera/dispatches \
            -d '{
              "event_type": "nekokolpa2-updated",
              "client_payload": {
                "ref": "${{ github.ref }}",
                "sha": "${{ github.sha }}",
                "actor": "${{ github.actor }}"
              }
            }'
