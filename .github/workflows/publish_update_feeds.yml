name: Publish Open update feeds

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Build NekokoLPA2]
    types: [completed]
    branches: [release]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable app tag; leave empty for latest
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: open-update-feeds
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify feed representation
        run: node --experimental-strip-types --test test/scripts/update_feed_entry.test.mjs
      - name: Select the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_web_release.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.release.outputs.deploy == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish verified public artifacts
        if: steps.release.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPDATE_WORKER_URL: ${{ secrets.UPDATE_WORKER_URL }}
          UPDATE_WORKER_KEY: ${{ secrets.UPDATE_WORKER_KEY }}
        run: python3 scripts/publish_update_feeds.py --release-tag "$RELEASE_TAG"
