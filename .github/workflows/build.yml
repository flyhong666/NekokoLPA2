name: Build NekokoLPA2

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_ID: ee.nekoko.nlpa2.open
  FLAVOR: community

jobs:
  meta:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_clean: ${{ steps.version.outputs.version_clean }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          version_clean="$(echo "$version" | sed 's/+/-/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_clean=$version_clean" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android (community)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release --flavor ${{ env.FLAVOR }} --target lib/main.dart
      - name: Rename APK to Kasutera scheme
        env:
          VERSION_CLEAN: ${{ needs.meta.outputs.version_clean }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk \
             "dist/${PACKAGE_ID}-${VERSION_CLEAN}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  web:
    name: Build web
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Package web build
        env:
          VERSION_CLEAN: ${{ needs.meta.outputs.version_clean }}
        run: |
          mkdir -p dist
          ( cd build/web && zip -r "../../dist/${PACKAGE_ID}-${VERSION_CLEAN}-web.zip" . )
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  linux:
    name: Build Linux (x64)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip tar libgtk-3-dev libblkid-dev liblzma-dev \
            libgcrypt20-dev libcurl4-openssl-dev libsecret-1-dev wget fuse
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tar.gz + AppImage
        env:
          VERSION_CLEAN: ${{ needs.meta.outputs.version_clean }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          BUNDLE=build/linux/x64/release/bundle
          TARNAME="${PACKAGE_ID}-${VERSION_CLEAN}-linux-x64"

          # Portable tarball
          ( cd "$BUNDLE/.." && tar -czf "$GITHUB_WORKSPACE/dist/${TARNAME}.tar.gz" -C bundle . )

          # AppImage
          APPDIR="appimage/${TARNAME}.AppDir"
          mkdir -p "$APPDIR"
          cp -r "$BUNDLE"/. "$APPDIR/"
          cat > "$APPDIR/${PACKAGE_ID}.desktop" <<EOF
          [Desktop Entry]
          Name=NekokoLPA 2 Community
          Exec=nlpa2
          Icon=${PACKAGE_ID}
          Type=Application
          Categories=Utility;
          EOF
          if [ -f data/logo.png ]; then
            cp data/logo.png "$APPDIR/${PACKAGE_ID}.png"
          elif [ -f assets/logo.png ]; then
            cp assets/logo.png "$APPDIR/${PACKAGE_ID}.png"
          else
            # 1x1 fallback so appimagetool does not fail
            printf '\x89PNG\r\n\x1a\n' > "$APPDIR/${PACKAGE_ID}.png"
          fi
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/nlpa2" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          ARCH=x86_64 appimagetool "$APPDIR" "dist/${TARNAME}.AppImage" || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Build Windows (x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Stage release tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $base = "$env:PACKAGE_ID-${{ needs.meta.outputs.version_clean }}-windows-x64"
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\$base.zip" -Force
      - name: Build Inno Setup installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $name    = ($version -split '\+')[0]
          $build   = ($version -split '\+')[1]
          if (-not $build) { $build = "0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Image refresh: ISCC sometimes lives under Program Files
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & $iscc /DAppVersion=$name /DAppBuildNumber=$build installer\installer.iss
          $expected = "build\windows\installer\$env:PACKAGE_ID-$name-$build-setup.exe"
          if (-not (Test-Path $expected)) {
            Write-Error "Installer not produced at $expected"
            exit 1
          }
          Copy-Item $expected "dist\$env:PACKAGE_ID-${{ needs.meta.outputs.version_clean }}-windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    name: Create GitHub Release
    if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
    needs: [meta, android, web, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          VERSION_CLEAN: ${{ needs.meta.outputs.version_clean }}
        run: |
          set -euo pipefail
          tag_name="v$VERSION"
          release_notes="$(awk -v ver="[$VERSION]" 'index($0, "## " ver) == 1 {p=1; next} p && /^## \[/ {p=0} p' CHANGELOG.md | sed '/^$/d' | head -n 20)"
          if [ -z "$release_notes" ]; then
            release_notes="Public builds for NekokoLPA2 v$VERSION"
          fi

          artifact_table="$(cat <<EOF
          | Artifact | Platform | Description |
          | --- | --- | --- |
          | \`${PACKAGE_ID}-${VERSION_CLEAN}-android.apk\` | Android | Community APK |
          | \`${PACKAGE_ID}-${VERSION_CLEAN}-web.zip\` | Web | Static web build |
          | \`${PACKAGE_ID}-${VERSION_CLEAN}-windows-setup.exe\` | Windows | Inno Setup installer |
          | \`${PACKAGE_ID}-${VERSION_CLEAN}-windows-x64.zip\` | Windows | Portable archive |
          | \`${PACKAGE_ID}-${VERSION_CLEAN}-linux-x64.tar.gz\` | Linux | Portable tarball |
          | \`${PACKAGE_ID}-${VERSION_CLEAN}-linux-x64.AppImage\` | Linux | AppImage |
          EOF
          )"

          full_notes="$release_notes

          ## Artifacts

          $artifact_table"

          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag_name" --repo "$GITHUB_REPOSITORY" \
              --title "NekokoLPA2 $tag_name" --notes "$full_notes"
          else
            gh release create "$tag_name" --repo "$GITHUB_REPOSITORY" \
              --title "NekokoLPA2 $tag_name" --notes "$full_notes"
          fi

          shopt -s nullglob
          uploads=(dist/*)
          if [ ${#uploads[@]} -gt 0 ]; then
            gh release upload "$tag_name" "${uploads[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
